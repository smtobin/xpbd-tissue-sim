name: "Virtuoso Trachea"
visualization: "VTK"

# Tissue grasping simulation-specific parameters
input-device: "Mouse" # the input device for interactivity - "Mouse" or "Haptic" (Phantom Omni)
show-tip-cursor: true
enable-mouse-interaction: true
haptic-force-scaling: 0

express-meshes-in-vb-frame: true

# device-name1: "LeftOmni"
# device-name2: "RightOmni"
# device-name1: "Omni"

g-accel: 0 # m/s2
# sim-mode: "Visualization"
# sim-mode: "Frame-by-frame"
sim-mode: "AFAP"
time-step: 3.33e-3 # for FO XPBD
# time-step: 3.33e-5 # for normal XPBD
collision-rate: 100
fps: 30
end-time: 5000

materials:
  -
    name: "Human Trachea"
    label: "Trachea"
    # material parameters
    density: 1030
    E: 5e6
    nu: 0.49

    # rendering settings
    color: [1.0, 0.3, 0.2]
    render-type: "PBR"
    metallic: 0.0
    roughness: 0.3
    smooth-normals: false
    draw-points: false
    draw-edges: true
    draw-faces: true
    
  -
    name: "Raw Chicken Breast"
    label: "Tumor"
    # material parameters
    density: 1060
    E: 0.07e6
    nu: 0.4

    # rendering settings
    color: [1.0, 0.4, 0.3]
    render-type: "PBR"
    metallic: 0.0
    roughness: 0.3
    smooth-normals: false
    draw-points: false
    draw-edges: true
    draw-faces: true

  -
    name: "Nitinol"
    # rendering settings
    color: [0.7, 0.7, 0.7]
    render-type: "PBR"
    metallic: 1.0
    roughness: 0.2

# rendering settings
exposure: 0.2
hdr-image-filename: "../resource/rendering/hdr/surgery_1k.hdr"
create-skybox: true
window-width: 1000
window-height: 1000

objects:

  -
    name: "Tumor"
    # type: "XPBDMeshObject"
    type: "FirstOrderXPBDMeshObject"
    filename: "../resource/demos/trachea_virtuoso/cao_04_29_25_model1_tumor_d.msh"
    fixed-faces-filename: "../resource/demos/trachea_virtuoso/cao_04_29_25_model1_tumor_d_fixed_faces.txt"
    # element-classes-filename: "../resource/demos/trachea_virtuoso/cao_04_29_25_model1_decimated3_r_element_classes.txt"
    material: "Raw Chicken Breast"
    # max-size: 0.017
    scaling: [1e-3, 1e-3, 1e-3]
    position: [0.110, 0.141, 0.07]
    velocity: [0, 0, 0]
    rotation: [0, 0, 0]
    num-solver-iters: 1
    num-local-collision-iters: 5
    residual-policy: "Never"
    solver-type: "Gauss-Seidel"
    # solver-type: "Jacobi"
    # solver-type: "Parallel-Jacobi"
    constraint-type: "Stable-Neohookean-Combined"
    damping-multiplier: 2e5
    # damping-multiplier: 6000000000
    # damping-multiplier: 40000000000
    adjust-damping-to-material: True

    collisions: true
    self-collisions: false
    adaptive-mesh-refinement: true
    max-refinement-level: 2
    compute-heat-conduction: false

  -
    name: "Trachea"
    type: "RigidMeshObject"
    # type: "FirstOrderXPBDMeshObject"
    filename: "../resource/demos/trachea_virtuoso/cao_04_29_25_model1_trachea_d.stl"
    material: "Human Trachea"
    # max-size: 0.095
    scaling: [1e-3, 1e-3, 1e-3]
    position: [0.110, 0.141, 0.07]
    velocity: [0, 0, 0]
    rotation: [0, 0, 0]

    collisions: false
    fixed: true

  -
    name: "Robot"
    type: "VirtuosoRobot"
    material: "Nitinol"
    # position: [0, -0.035, -0.0015] #"close position"
    position: [0, 0, 0]
    rotation: [0, 0, 0] # TODO: fix bug where changing VB orientation causes misalignment. 12/5
    collisions: true

    arms:
    -
      name: "Arm1"
      type: "VirtuosoArm"
      outer-tube-diameter: 1.56e-3
      outer-tube-radius-of-curvature: 1.5383e-2
      outer-tube-distal-straight-length: 5e-3
      outer-tube-translation: 6e-3
      outer-tube-rotation: 60
      inner-tube-rotation: 30
      inner-tube-diameter: 1.04e-3
      inner-tube-translation: 6e-3

    -
      name: "Arm2"
      type: "VirtuosoArm"
      tool-type: "cautery"
      cutting-model: "instant"
      outer-tube-diameter: 1.56e-3
      outer-tube-radius-of-curvature: 1.5383e-2
      outer-tube-distal-straight-length: 5e-3
      outer-tube-translation: 6e-3
      outer-tube-rotation: -45
      inner-tube-rotation: 45
      inner-tube-diameter: 1.04e-3
      inner-tube-translation: 12e-3

  


