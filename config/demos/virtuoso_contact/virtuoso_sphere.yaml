# === Simulation parameters ===
# name of the simulation
name: "Virtuoso Trachea"
# visualization backend to use ("VTK" or "Easy3D")
visualization: "VTK"

# the input device for interactivity - "Keyboard", "Mouse" or "Haptic" (Phantom Omni)
input-device: "Haptic"
# show the "tip cursor" which is a yellow ball meant to help with depth perception 
show-tip-cursor: false
# whether or not to enable mouse interaction with the view (note this is always disabled when the "Mouse" input mode is used)
enable-mouse-interaction: true
# scale the force feedback tot he haptic device (0 means no force feedback)
haptic-force-scaling: 0

# device names for haptic devices
# these can be set using the OpenHaptics setup program
# device-name1: "LeftOmni"
# device-name2: "RightOmni"
# device-name1: "Omni"

# acceleration due to gravity
g-accel: 0 # m/s2

# simulation "mode" - should always use As Fast As Possible ("AFAP") with 1st order sims
sim-mode: "AFAP"
# the "time step" (doesn't correspond to physical time for 1st order sims)
time-step: 3.33e-3
# the rate (Hz) at which to do collision detection
collision-rate: 100
# the rate (Hz) at which to draw to the screen
fps: 30
# the simulation end time
end-time: 5000000000000


# === Simulation rendering settings ===
# global exposure for PBR rendering
exposure: 0.2
# filename to the HDR image used for lighting in the PBR model
hdr-image-filename: "../resource/rendering/hdr/surgery_1k.hdr"
# whether or not to create a skybox from the HDR image
create-skybox: false
# static color background for the sim
background: [0.1, 0.1, 0.1] # dark gray
# width and height of the window created for the sim
window-width: 1000
window-height: 1000

# whether or not to render offscreen to an image buffer
# Note: only possible with VTK graphics
# Another Note: necessary for publishing images over ROS2
offscreen-rendering: true

# whether or not to add the circle vignette to the rendered image
# this mimics the output of the actual Virtuoso endoscope image
circle-crop: true

# whether or not to display camera axes in the bottom left corner
show-camera-axes: false

# === Specify materials used by objects in the sim ===
# these materials have both physical properties (Young's modulus, density, etc.) and rendering properties
materials:
  -
    name: "Human Trachea"
    label: "Trachea"
    # material parameters
    density: 1030
    E: 5e6
    nu: 0.49
    # rendering settings
    color: [1.0, 0.5, 0.4]
    render-type: "PBR"
    metallic: 0.0
    roughness: 0.4
    smooth-normals: true
    draw-points: false
    draw-edges: false
    draw-faces: true
    
  -
    name: "Raw Chicken Breast"
    label: "Tumor"
    # material parameters
    density: 1060
    E: 0.07e6
    nu: 0.4
    # rendering settings
    color: [1.0, 0.6, 0.5]
    cut-color: [0.12, 0.08, 0.0]
    render-type: "PBR"
    metallic: 0.0
    roughness: 0.2
    smooth-normals: true
    draw-points: false
    draw-edges: false
    draw-faces: true

  -
    name: "Nitinol"
    label: "Tool"
    # rendering settings
    color: [0.7, 0.7, 0.7]
    render-type: "PBR"
    metallic: 1.0
    roughness: 0.2


# === Objects in the sim ===
objects:
  -
    name: "Sphere"
    type: "RigidSphere"
    material: "Human Trachea"
    radius: 2e-3
    position: [0,0,20e-3]
    

    collisions: true
    fixed: true

  -
    name: "Robot"
    type: "VirtuosoRobot"
    material: "Nitinol"
    # don't prescribe any initial position or rotation - it is completely arbitrary since we are positioning meshes to be in the VB frame

    collisions: true

    arms:
    -
      name: "Arm1"
      type: "VirtuosoArm"
      material: "Nitinol"
      outer-tube-diameter: 1.56e-3
      outer-tube-radius-of-curvature: 1.5383e-2
      outer-tube-distal-straight-length: 5e-3
      outer-tube-translation: 6e-3
      outer-tube-rotation: 60
      inner-tube-rotation: 30
      inner-tube-diameter: 1.04e-3
      inner-tube-translation: 15e-3

    - # right arm has the cautery tool for cutting
      name: "Arm2"
      type: "VirtuosoArm"
      material: "Nitinol"
      tool-type: "cautery"
      cutting-model: "timer"  # the type of cutting model employed - "instant", "timer", or "thermal"
      time-threshold: 0.03  # in seconds of wall-clock time
      outer-tube-diameter: 1.56e-3
      outer-tube-radius-of-curvature: 1.5383e-2
      outer-tube-distal-straight-length: 5e-3
      outer-tube-translation: 6e-3
      outer-tube-rotation: -45
      inner-tube-rotation: 45
      inner-tube-diameter: 1.04e-3
      inner-tube-translation: 10e-3

  


